name: Publish Anima v1.0.1 to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ukr8b3g-cmyk/Anima-Character-Sheet-Designer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 063c0ba7541a945aecb765ea378b0c2e6c7de90c
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the install package
        run: |
          python tools/build_release.py
          python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import tomllib
          import zipfile

          folder = "Anima-Character-Sheet-Designer"
          dest = Path(os.environ["RUNNER_TEMP"]) / "anima-registry"
          dest.mkdir()
          with zipfile.ZipFile(f"dist/{folder}-v1.0.1.zip") as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  parts = PurePosixPath(name).parts
                  assert len(parts) > 1 and parts[0] == folder and ".." not in parts
                  target = dest.joinpath(*parts[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          meta = dest / "pyproject.toml"
          data = meta.read_bytes()
          config = tomllib.loads(data.decode())
          assert config["project"]["name"] == "anima-character-sheet-designer"
          assert config["project"]["version"] == "1.0.1"
          assert config["project"]["urls"]["Repository"] == "https://github.com/ukr8b3g-cmyk/Anima-Character-Sheet-Designer"
          assert "comfy" not in config.get("tool", {})
          meta.write_bytes(data.rstrip(b"\r\n") + b'\n\n[tool.comfy]\nPublisherId = "ukr8b3g-cmyk"\nDisplayName = "Anima Character Sheet Designer"\n')
          PY
      - name: Validate the Registry archive
        run: |
          python -m pip install --disable-pip-version-check comfy-cli==1.22.0
          cd "$RUNNER_TEMP/anima-registry"
          git init --quiet
          git add --all
          comfy --skip-prompt --no-enable-telemetry node pack
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile

          paths = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().strip("\0").split("\0"))
          with zipfile.ZipFile("node.zip") as archive:
              names = archive.namelist()
              assert len(names) == len(paths) and set(names) == paths
              assert archive.testzip() is None
              for path in paths:
                  assert archive.read(path) == Path(path).read_bytes(), path
          Path("node.zip").unlink()
          print(f"Verified {len(paths)} Registry package files.")
          PY
      - name: Publish and verify v1.0.1
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/anima-registry"
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import zipfile

          publisher = "ukr8b3g-cmyk"
          node = "anima-character-sheet-designer"
          version = "1.0.1"
          endpoint = f"https://api.comfy.org/nodes/{node}/versions/{version}"
          package_url = f"https://cdn.comfy.org/{publisher}/{node}/{version}/node.zip"

          def record():
              try:
                  with urllib.request.urlopen(endpoint, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise

          current = record()
          if current is None:
              token = os.environ.pop("REGISTRY_ACCESS_TOKEN", "")
              if not token:
                  raise SystemExit("Set the REGISTRY_ACCESS_TOKEN repository secret.")
              subprocess.run(["comfy", "--skip-prompt", "--no-enable-telemetry", "node", "publish", "--token", token], check=True)
              for _ in range(12):
                  current = record()
                  if current is not None:
                      break
                  time.sleep(3)
          assert current and current["node_id"] == node and current["version"] == version
          assert current["downloadUrl"] == package_url
          with urllib.request.urlopen(package_url, timeout=25) as response:
              package = response.read()
          paths = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().strip("\0").split("\0"))
          with zipfile.ZipFile(io.BytesIO(package)) as archive:
              names = archive.namelist()
              assert len(names) == len(paths) and set(names) == paths
              assert archive.testzip() is None
              for path in paths:
                  assert archive.read(path) == Path(path).read_bytes(), path
          print(json.dumps({"node": node, "version": version, "status": current["status"], "files": len(paths), "sha256": hashlib.sha256(package).hexdigest()}))
          PY
